# Link check settings shared by every repository (links.yml writes this file when a repository
# has none). Keep the exclusions short and explain each one: a link that is excluded is a link
# nobody checks.

# Re-check a link at most once a day; the cache is kept between workflow runs.
cache = true
max_cache_age = "1d"
cache_exclude_status = "429, 500.."

max_concurrency = 8
max_retries = 3
timeout = 20

# Anchors (#section) in Markdown and HTML files must exist, so README buttons and the table of
# contents cannot point at a renamed heading.
include_fragments = "anchor-only"

# A link passes when it answers with a success or a redirect. 403 and 429 fail as well, so a page
# that refuses the checker or rate-limits it is noticed instead of passing unseen; retries above
# cover short rate limits.
accept = ["200..=399"]

exclude_loopback = true
exclude_private = true
exclude_link_local = true

exclude = [
  # Sites that answer automated requests with 999 or a sign-in wall.
  '^https://(www\.)?linkedin\.com/',
  '^https://(www\.)?x\.com/',
  # Placeholder hosts used in code samples.
  '^https?://(www\.)?example\.(com|org|net)',
  '^https?://api\.example\.com',
  # Pull request and comparison pages that only exist after a push.
  '^https://github\.com/[^/]+/[^/]+/compare/',
]

# The READMEs link to this repository's own files on master (graphics in .github/brand, images in
# docs/images, Package.swift, LICENSE, folders). A pull request cannot change master, so the
# checked-out files stand in for them: on master they are the same files, on a pull request they
# are the ones it adds or removes. The path is the workspace of GitHub-hosted runners; a local run
# passes the same --remap options with its own path.
remap = [
  '^https://raw\.githubusercontent\.com/muhittincamdali/iOSDevelopmentTools/master/(.*)$ file:///home/runner/work/iOSDevelopmentTools/iOSDevelopmentTools/$1',
  '^https://github\.com/muhittincamdali/iOSDevelopmentTools/(?:blob|tree)/master/(.*)$ file:///home/runner/work/iOSDevelopmentTools/iOSDevelopmentTools/$1',
  # The documentation pages on GitHub Pages are built from the .docc catalog by docs.yml after a
  # push to master, so a pull request that adds the catalog or an article links to pages that are
  # not online yet. The root and each article URL are checked against their source files instead.
  '^https://muhittincamdali\.github\.io/iOSDevelopmentTools/documentation/iosdevelopmenttools/?$ file:///home/runner/work/iOSDevelopmentTools/iOSDevelopmentTools/Sources/iOSDevelopmentTools/iOSDevelopmentTools.docc/iOSDevelopmentTools.md',
  '^https://muhittincamdali\.github\.io/iOSDevelopmentTools/documentation/iosdevelopmenttools/gettingstarted$ file:///home/runner/work/iOSDevelopmentTools/iOSDevelopmentTools/Sources/iOSDevelopmentTools/iOSDevelopmentTools.docc/GettingStarted.md',
  '^https://muhittincamdali\.github\.io/iOSDevelopmentTools/documentation/iosdevelopmenttools/capturingnetworktraffic$ file:///home/runner/work/iOSDevelopmentTools/iOSDevelopmentTools/Sources/iOSDevelopmentTools/iOSDevelopmentTools.docc/CapturingNetworkTraffic.md',
  '^https://muhittincamdali\.github\.io/iOSDevelopmentTools/documentation/iosdevelopmenttools/redactingsensitivedata$ file:///home/runner/work/iOSDevelopmentTools/iOSDevelopmentTools/Sources/iOSDevelopmentTools/iOSDevelopmentTools.docc/RedactingSensitiveData.md',
  '^https://muhittincamdali\.github\.io/iOSDevelopmentTools/documentation/iosdevelopmenttools/keepingtoolsoutofreleasebuilds$ file:///home/runner/work/iOSDevelopmentTools/iOSDevelopmentTools/Sources/iOSDevelopmentTools/iOSDevelopmentTools.docc/KeepingToolsOutOfReleaseBuilds.md',
]

exclude_path = [
  "node_modules",
  ".build",
  "build",
  "Pods",
]
